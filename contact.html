<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>My Blog — Contact</title>
	<meta name="description" content="Get in touch with me.">
	<meta name="author" content="Your Name">
	<meta name="keywords" content="contact, email, message">

	<!-- Open Graph -->
	<meta property="og:title" content="My Blog — Contact">
	<meta property="og:description" content="Get in touch with me.">
	<meta property="og:type" content="website">

	<link rel="stylesheet" href="style.css">
	<script defer src="script.js"></script>
</head>
<body>
	<header class="site-header">
		<div class="container header-inner">
			<a class="site-logo" href="index.html">My Blog</a>
			<nav class="site-nav" aria-label="Main navigation">
				<ul>
					<li><a href="index.html">Home</a></li>
					<li><a href="about.html">About</a></li>
					<li><a href="blog.html">Blog</a></li>
					<li><a href="contact.html">Contact</a></li>
				</ul>
			</nav>
		</div>
	</header>

	<main>
		<section class="container">
			<h1>Get In Touch</h1>
			<p>Have a question or want to collaborate? Feel free to reach out!</p>
			
			<form id="contact-form" action="#" method="POST" class="contact-form">
				<div class="form-group">
					<label for="name">Name</label>
					<input type="text" id="name" name="name" required>
				</div>

				<div class="form-group">
					<label for="email">Email</label>
					<input type="email" id="email" name="email" required>
				</div>

				<div class="form-group">
					<label for="message">Message</label>
					<textarea id="message" name="message" rows="5" required></textarea>
				</div>

				<button type="submit">Send Message</button>
			</form>

			<div class="contact-info">
				<h3>Other ways to reach me:</h3>
				<p>
					<strong>Email:</strong>
					<a href="mailto:shuai.zhang@students.iaac.net" target="_blank" rel="noopener noreferrer">shuai.zhang@students.iaac.net</a>
					<button type="button" id="email-open" class="btn" style="margin-left:10px;">Send Email</button>
					<br>
					<strong>Twitter:</strong> <a href="#">@danielzhang</a><br>
					<strong>GitHub:</strong> <a href="#">github.com/danielzhang</a>
				</p>
			</div>
		</section>
	</main>

	<footer class="site-footer">
		<div class="container">
			<p>© 2026 Daniel Zhang — <a href="contact.html">Contact</a></p>
			<p class="social">
				<a href="#">Twitter</a> · <a href="#">GitHub</a>
			</p>
		</div>
	</footer>

</body>
</html>
